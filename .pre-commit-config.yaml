repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: blueprint-secret-files
        name: blueprint secret-file check
        entry: .githooks/pre-commit
        language: system
        pass_filenames: false
        always_run: true
